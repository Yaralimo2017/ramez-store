<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RAMEZ Luxury Fashion House — دار أزياء فاخرة: ملابس وأحذية وإكسسوارات رجالي وحريمي">
<link rel="icon" href="images/logo-mark.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RAMEZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@500;600;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Layout: a quiet maison storefront — calligraphic wordmark, arched "vitrine" frames for every piece, wide margins, brass hairlines only where they mark a boundary. Dark-first (evening boutique), light = daytime atelier. Bilingual: Arabic (RTL) / English (LTR). */
:root{
  --bg:#16181C; --surface:#1E2126; --fg:#EDEBE7; --muted:#9C9FA5;
  --brass:#F2921F; --brass-soft:rgba(242,146,31,.15); --line:rgba(237,235,231,.12); --scrim:rgba(6,7,9,.62); --ok:#8FBF9A;
  --font-mark:"Aref Ruqaa","Amiri",serif;
  --font-head:"Amiri","Times New Roman",serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --step--1:.8125rem; --step-0:1rem; --step-1:1.25rem; --step-2:1.6rem; --step-3:2.2rem; --step-4:clamp(2.6rem,6vw,4.4rem); --step-5:clamp(3.6rem,11vw,8rem);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEEDEA; --surface:#F8F7F5; --fg:#17191D; --muted:#5D6067;
    --brass:#A85500; --brass-soft:rgba(168,85,0,.11); --line:rgba(23,25,29,.14); --scrim:rgba(23,25,29,.45); --ok:#2F6B43;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEEDEA; --surface:#F8F7F5; --fg:#17191D; --muted:#5D6067;
  --brass:#A85500; --brass-soft:rgba(168,85,0,.11); --line:rgba(23,25,29,.14); --scrim:rgba(23,25,29,.45); --ok:#2F6B43;
  color-scheme:light;
}
#app[lang="en"]{--font-mark:"Cormorant Garamond","Amiri",serif;--font-head:"Cormorant Garamond","Amiri",serif;--step-5:clamp(3.2rem,9vw,6.8rem)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--step-0);line-height:1.75;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--brass);outline-offset:3px}
h1,h2,h3{font-family:var(--font-head);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
#app[lang="en"] h1,#app[lang="en"] h2,#app[lang="en"] h3{line-height:1.12}
p{margin:0}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:var(--step--1);letter-spacing:.08em;color:var(--brass);font-weight:500}
#app[lang="en"] .eyebrow{text-transform:uppercase;letter-spacing:.18em}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
#app[dir="rtl"] .ltr{text-align:right}

.notice{border-bottom:1px solid var(--line);font-size:var(--step--1);color:var(--muted)}
.notice .wrap{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding-block:8px;text-align:center}

header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.site .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.mark{font-family:"Montserrat","Segoe UI",sans-serif;font-weight:600;font-size:1.35rem;letter-spacing:.24em;line-height:1;color:var(--fg);justify-self:center;display:flex;align-items:center;gap:12px;direction:ltr}
.mark img{display:block;height:56px;width:auto}

nav.main{display:flex;gap:22px;font-size:.92rem;min-width:0}
nav.main a{color:var(--muted);transition:color .2s}
nav.main a:hover{color:var(--fg)}
.tools{display:flex;gap:6px;justify-self:end;align-items:center}
.icon-btn{position:relative;background:none;border:1px solid transparent;border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn:hover{border-color:var(--line)}
.icon-btn svg{width:20px;height:20px}
.lang{background:none;border:1px solid var(--line);border-radius:999px;height:34px;padding-inline:14px;cursor:pointer;font-size:.85rem;color:var(--fg)}
.lang:hover{border-color:var(--brass);color:var(--brass)}
.badge{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--brass);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;padding-inline:4px}
.badge[data-zero="1"]{display:none}
@media (max-width:820px){
  header.site .wrap{grid-template-columns:1fr auto}
  .mark{justify-self:start}
  .mark img{height:46px}
  nav.main{grid-column:1/-1;grid-row:2;overflow-x:auto;padding-bottom:2px;gap:18px;white-space:nowrap}
}

.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(40px,7vw,96px)}
.hero h1{font-family:var(--font-mark);font-size:var(--step-5);line-height:1.05}
.hero h1 span{color:var(--brass)}
#app[lang="en"] .hero h1 span{font-style:italic}
.hero .lede{font-size:var(--step-1);color:var(--muted);max-width:34ch;margin-top:20px;font-weight:300}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border:1px solid var(--brass);background:var(--brass);color:var(--bg);font-weight:500;cursor:pointer;transition:background .25s,color .25s;border-radius:0}
.btn:hover{background:transparent;color:var(--brass)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}
.vitrine{position:relative;aspect-ratio:3/4;max-width:100%;width:min(100%,440px);justify-self:center;border-radius:999px 999px 0 0;background:radial-gradient(120% 70% at 50% 10%,var(--brass-soft),transparent 60%),var(--surface);border:1px solid var(--line);overflow:hidden}
.vitrine::after{content:"";position:absolute;inset:14px;border:1px solid var(--brass);opacity:.45;border-radius:999px 999px 0 0;pointer-events:none}
.vitrine svg.art{position:absolute;inset:16% 14% 14%;width:72%;height:70%;color:var(--brass)}
.vitrine .tag{position:absolute;bottom:26px;inset-inline:0;text-align:center;font-size:var(--step--1);color:var(--muted)}
.vitrine .tag b{display:block;font-family:var(--font-head);font-size:var(--step-1);font-weight:400;color:var(--fg)}
@media (prefers-reduced-motion:no-preference){
  .vitrine svg.art path,.vitrine svg.art circle{stroke-dasharray:600;animation:draw 2.6s ease-out both}
  @keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.vitrine{width:min(100%,340px)}}

.split .wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-block:1px solid var(--line)}
.split a{background:var(--bg);padding:clamp(28px,5vw,56px) clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:end;gap:16px;transition:background .3s}
.split a:hover{background:var(--surface)}
.split h2{font-size:var(--step-4)}
.split p{color:var(--muted);font-size:.92rem;margin-top:6px}
.split .arrow{font-family:var(--font-head);font-size:var(--step-2);color:var(--brass)}
#app[dir="ltr"] .split .arrow{transform:scaleX(-1)}
@media (max-width:640px){.split .wrap{grid-template-columns:1fr}}

section.collection .wrap{padding-block:clamp(48px,7vw,96px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:var(--step-3);margin-top:6px}
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:34px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;padding:7px 18px;border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{color:var(--muted);font-size:var(--step--1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:clamp(18px,2.4vw,32px)}
.card{display:flex;flex-direction:column;gap:14px;min-width:0}
.card .frame{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--surface);border-radius:999px 999px 0 0;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);transition:border-color .3s}
.card .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 18%,var(--tone),transparent 70%)}
.card:hover .frame{border-color:var(--brass)}
.card .frame svg{position:relative;width:58%;height:58%;color:var(--brass);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .frame svg{transform:scale(1.05)}
.card .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .frame img{transform:scale(1.04)}
.card .wish{position:absolute;bottom:12px;inset-inline-end:12px;background:var(--bg);border:1px solid var(--line)}
.card .wish[aria-pressed="true"] svg{fill:var(--brass);color:var(--brass)}
.card .ribbon{position:absolute;bottom:16px;inset-inline-start:14px;font-size:11px;letter-spacing:.06em;color:var(--brass);border:1px solid var(--brass);padding:2px 10px;background:var(--bg)}
.card .meta{display:flex;flex-direction:column;gap:2px}
.card .line1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h3{font-size:var(--step-1)}
#app[lang="en"] .card h3{font-size:1.45rem}
.card .price{font-weight:500;white-space:nowrap}
.card .mat{color:var(--muted);font-size:.86rem}
.card .add{margin-top:8px;align-self:flex-start;background:none;border:none;border-bottom:1px solid var(--brass);color:var(--brass);padding:2px 0;cursor:pointer;font-size:.9rem}
.card .add:hover{color:var(--fg);border-color:var(--fg)}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sizes button{min-width:36px;height:30px;border:1px solid var(--line);background:none;cursor:pointer;font-size:.8rem;color:var(--muted)}
.sizes button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}

.craft{background:var(--surface);border-block:1px solid var(--line)}
.craft .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,6vw,96px);padding-block:clamp(48px,7vw,96px)}
.craft h2{font-size:var(--step-3);margin-top:8px}
.craft .intro p{color:var(--muted);margin-top:16px;max-width:42ch}
.facts{display:grid;margin:0}
.fact{display:grid;grid-template-columns:9rem 1fr;gap:20px;padding-block:22px;border-top:1px solid var(--line)}
.fact:last-child{border-bottom:1px solid var(--line)}
.fact dt{font-family:var(--font-head);font-size:var(--step-2);color:var(--brass);line-height:1.2}
.fact dd{margin:0;min-width:0}
.fact dd b{display:block;font-weight:500}
.fact dd span{color:var(--muted);font-size:.92rem}
@media (max-width:820px){.craft .wrap{grid-template-columns:1fr}.fact{grid-template-columns:1fr;gap:4px}}

.appoint .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,96px);padding-block:clamp(48px,7vw,96px);align-items:start}
.appoint h2{font-size:var(--step-4);font-family:var(--font-mark);line-height:1.2}
.appoint .copy p{color:var(--muted);margin-top:16px;max-width:40ch}
.appoint ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px}
.appoint li{display:flex;gap:12px;align-items:baseline}
.appoint li::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--brass);flex:none;translate:0 -2px}
form.book{display:grid;gap:18px;border:1px solid var(--line);padding:clamp(20px,3vw,36px);background:var(--surface)}
.field{display:grid;gap:6px}
.field label{font-size:var(--step--1);color:var(--muted)}
.field input,.field select{background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;width:100%}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--brass)}
.field select option{background:var(--surface);color:var(--fg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.formmsg{font-size:.92rem;color:var(--ok)}
.formerr{font-size:.85rem;color:var(--brass)}
@media (max-width:820px){.appoint .wrap{grid-template-columns:1fr}}
@media (max-width:460px){.row2{grid-template-columns:1fr}}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;padding-block:48px 32px}
footer .logo{display:block;width:120px;max-width:100%;height:auto}
footer .brandcol p{margin-top:12px;max-width:34ch}
footer h4{margin:0 0 10px;color:var(--fg);font-weight:500;font-size:.95rem}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
footer a:hover{color:var(--fg)}
.legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:var(--step--1)}
@media (max-width:820px){footer .wrap{grid-template-columns:1fr 1fr}footer .brandcol{grid-column:1/-1}}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);z-index:80;background:var(--bg);border-inline-start:1px solid var(--line);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;visibility:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-inline-end:env(safe-area-inset-left,0px)}
#app[dir="ltr"] aside.drawer{transform:translateX(102%);padding-inline-end:env(safe-area-inset-right,0px)}
#app aside.drawer.open{transform:none;visibility:visible}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.dr-head h3{font-size:var(--step-2)}
.dr-body{flex:1;overflow-y:auto;padding:8px 24px}
.dr-item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.dr-item .thumb{width:64px;height:80px;background:var(--surface);border-radius:32px 32px 0 0;display:grid;place-items:center;color:var(--brass)}
.dr-item .thumb svg{width:40px;height:40px}
.dr-item .thumb{overflow:hidden}
.dr-item .thumb img{width:100%;height:100%;object-fit:cover}
.dr-item .nm{font-family:var(--font-head);font-size:1.1rem;line-height:1.3}
.dr-item .sub{color:var(--muted);font-size:.82rem}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:none;cursor:pointer;line-height:1}
.rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--font-head);font-size:var(--step-1);color:var(--fg);font-weight:400;margin-bottom:6px}
.dr-foot{border-top:1px solid var(--line);padding:20px 24px;display:grid;gap:12px}
.dr-foot:empty{display:none}
.dr-foot .tot{display:flex;justify-content:space-between;font-size:var(--step-1)}
.dr-foot .note{font-size:var(--step--1);color:var(--muted)}
.dr-foot .btn{justify-content:center}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;background:var(--fg);color:var(--bg);padding:10px 22px;z-index:90;font-size:.92rem;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(8px);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div dir="rtl" lang="ar" id="app">

<div class="notice"><div class="wrap">
  <span data-t="n1"></span><span data-t="n2"></span><span data-t="n3"></span>
</div></div>

<header class="site"><div class="wrap">
  <nav class="main" data-ta="navLabel">
    <a href="#collection" data-go="men" data-t="men"></a>
    <a href="#collection" data-go="women" data-t="women"></a>
    <a href="#collection" data-go-cat="shoes" data-t="shoes"></a>
    <a href="#collection" data-go-cat="acc" data-t="acc"></a>
    <a href="#appoint" data-t="private"></a>
  </nav>
  <a href="#top" class="mark"><img src="images/logo-mark.png" alt="RAMEZ" width="520" height="404"></a>
  <div class="tools">
    <button class="lang" id="langBtn" lang="en">English</button>
    <button class="icon-btn" id="themeBtn" data-ta="themeLabel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
    <button class="icon-btn" id="wishBtn" data-ta="wishlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      <span class="badge num" id="wishCount" data-zero="1">0</span>
    </button>
    <button class="icon-btn" id="cartBtn" data-ta="bag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge num" id="cartCount" data-zero="1">0</span>
    </button>
  </div>
</div></header>

<main id="top">
  <section class="hero"><div class="wrap">
    <div>
      <p class="eyebrow" data-t="season"></p>
      <h1 data-th="heroH"></h1>
      <p class="lede" data-t="heroP"></p>
      <div class="actions">
        <a class="btn" href="#collection" data-t="explore"></a>
        <a class="btn ghost" href="#appoint" data-t="book"></a>
      </div>
    </div>
    <div class="vitrine" aria-hidden="true">
      <svg class="art" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M42 14 L60 30 L78 14 L98 24 L104 112 L16 112 L22 24 Z"/>
        <path d="M60 30 L54 112 M60 30 L66 112"/>
        <path d="M42 14 L50 56 L60 30 M78 14 L70 56 L60 30"/>
        <path d="M28 70 L44 70 M76 70 L92 70"/>
        <circle cx="58" cy="78" r="1.4"/><circle cx="58" cy="90" r="1.4"/>
        <path d="M74 38 L84 36 L84 40"/>
      </svg>
      <p class="tag"><b data-t="heroItem"></b><span data-t="heroItemSub"></span></p>
    </div>
  </div></section>

  <section class="split" data-ta="chooseSection"><div class="wrap">
    <a href="#collection" data-go="men">
      <div><h2 data-t="forHim"></h2><p data-t="forHimP"></p></div>
      <span class="arrow" aria-hidden="true">←</span>
    </a>
    <a href="#collection" data-go="women">
      <div><h2 data-t="forHer"></h2><p data-t="forHerP"></p></div>
      <span class="arrow" aria-hidden="true">←</span>
    </a>
  </div></section>

  <section class="collection" id="collection"><div class="wrap">
    <div class="sec-head">
      <div><p class="eyebrow" data-t="collection"></p><h2 data-t="collectionH"></h2></div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <div class="filters">
      <div class="seg" role="group" data-ta="genderLabel">
        <button class="chip" data-g="all" aria-pressed="true" data-t="all"></button>
        <button class="chip" data-g="men" aria-pressed="false" data-t="men"></button>
        <button class="chip" data-g="women" aria-pressed="false" data-t="women"></button>
      </div>

  {id:'w6',g:'women',c:'acc',p:148000,i:'bag',t:'rgba(150,100,60,.25)',r:'pre',n:['حقيبة يد «القاهرة»','The Cairo Handbag'],m:['جلد توجو · تشطيب ذهبي ٢٤ قيراط','Togo leather · 24k gold hardware']},
  {id:'w7',g:'women',c:'acc',p:32400,i:'clutch',t:'rgba(90,110,140,.22)',n:['حقيبة سهرة كلتش','Evening Clutch'],m:['مخمل حريري · قفل لؤلؤ','Silk velvet · pearl clasp']},
  {id:'w8',g:'women',c:'acc',p:212000,i:'necklace',t:'rgba(80,150,110,.22)',n:['عقد زمرد','Emerald Necklace'],m:['ذهب أصفر ١٨ قيراط · زمرد كولومبي','18k yellow gold · Colombian emerald']},
  {id:'w9',g:'women',c:'acc',p:11900,i:'shades',t:'rgba(130,120,100,.2)',n:['نظارة شمس أسيتات','Acetate Sunglasses'],m:['أسيتات إيطالي · عدسات مستقطبة','Italian acetate · polarised lenses']},
];
const RIB={ltd:['إصدار محدود','Limited edition'],one:['قطعة واحدة','One of a kind'],pre:['بالطلب المسبق','Pre-order']};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('nobl.lang','ar'); if(!T[lang])lang='ar';
let cart=store.get('nobl.cart',[]); let wish=store.get('nobl.wish',[]);
let fG='all',fC='all',mode='cart'; const chosen={};
const $=s=>document.querySelector(s);
const t=k=>T[lang][k];
const L=a=>a[lang==='ar'?0:1];
const loc=()=>lang==='ar'?'ar-EG':'en-GB';
const nf=n=>n.toLocaleString(loc());
const fmt=n=>lang==='ar'?nf(n)+' '+t('cur'):t('cur')+' '+nf(n);

function applyLang(){
  const app=$('#app'),dir=lang==='ar'?'rtl':'ltr';
  app.lang=lang;app.dir=dir;document.documentElement.lang=lang;document.documentElement.dir=dir;document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ta)));
  const lb=$('#langBtn');lb.textContent=t('other');lb.lang=lang==='ar'?'en':'ar';
  render();badges();drawer();
  if(!$('#formMsg').hidden||!$('#formErr').hidden){$('#formMsg').hidden=true;$('#formErr').hidden=true}
}
function render(){
  const list=P.filter(p=>(fG==='all'||p.g===fG)&&(fC==='all'||p.c===fC));
  $('#count').textContent=nf(list.length)+' '+t('pieces');
  $('#grid').innerHTML=list.map(p=>`
    <article class="card" style="--tone:${p.t}">
      <div class="frame">${pic(p)}
        ${p.r?`<span class="ribbon">${L(RIB[p.r])}</span>`:''}
        <button class="icon-btn wish" data-wish="${p.id}" aria-pressed="${wish.includes(p.id)}" aria-label="${t('addWish')}: ${L(p.n)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></button>
      </div>
      <div class="meta">
        <div class="line1"><h3>${L(p.n)}</h3><span class="price num">${fmt(p.p)}</span></div>
        <p class="mat">${t(p.g)} · ${L(p.m)}</p>
        ${p.s?`<div class="sizes" role="group" aria-label="${t('size')}">${p.s.map(z=>`<button data-size="${p.id}" data-v="${z}" aria-pressed="${chosen[p.id]===z}">${z}</button>`).join('')}</div>`:''}
        <button class="add" data-add="${p.id}">${t('addBag')}</button>
      </div>
    </article>`).join('');
}
function syncChips(){
  document.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===fG));
  document.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===fC));
}
function badges(){
  const n=cart.reduce((a,x)=>a+x.q,0),cc=$('#cartCount'),wc=$('#wishCount');
  cc.textContent=nf(n);cc.dataset.zero=n?0:1;wc.textContent=nf(wish.length);wc.dataset.zero=wish.length?0:1;
}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}
function drawer(){
  const body=$('#drBody'),foot=$('#drFoot');
  if(mode==='wish'){
    $('#drTitle').textContent=t('wishlist');
    const items=P.filter(p=>wish.includes(p.id));
    body.innerHTML=items.length?items.map(p=>`<div class="dr-item"><div class="thumb">${pic(p)}</div><div><div class="nm">${L(p.n)}</div><div class="sub num">${fmt(p.p)}</div></div><button class="rm" data-unwish="${p.id}">${t('remove')}</button></div>`).join('')
      :`<div class="empty"><b>${t('emptyWish')}</b>${t('emptyWishP')}</div>`;
    foot.innerHTML='';return;
  }
  $('#drTitle').textContent=t('bag');
  if(!cart.length){body.innerHTML=`<div class="empty"><b>${t('emptyBag')}</b>${t('emptyBagP')}</div>`;foot.innerHTML='';return}
  body.innerHTML=cart.map((x,i)=>{const p=P.find(q=>q.id===x.id);return `<div class="dr-item"><div class="thumb">${pic(p)}</div>
    <div><div class="nm">${L(p.n)}</div><div class="sub">${x.s?t('size')+' '+x.s+' · ':''}<span class="num">${fmt(p.p)}</span></div>
    <div class="qty"><button data-q="${i}" data-d="-1" aria-label="${t('less')}">−</button><span class="num">${nf(x.q)}</span><button data-q="${i}" data-d="1" aria-label="${t('more')}">+</button></div></div>
    <button class="rm" data-rm="${i}">${t('remove')}</button></div>`}).join('');
  const tot=cart.reduce((a,x)=>a+P.find(q=>q.id===x.id).p*x.q,0);
  foot.innerHTML=`<div class="tot"><span>${t('total')}</span><span class="num">${fmt(tot)}</span></div>
    <p class="note">${t('shipNote')}</p><button class="btn" id="checkout">${t('checkout')}</button><p class="formmsg" id="coMsg" hidden></p>`;
}
function openDr(m){mode=m;drawer();$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('open')}
function closeDr(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('open')}
const save=()=>{store.set('nobl.cart',cart);store.set('nobl.wish',wish);badges()};

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
  if(d.g){fG=d.g;syncChips();render()}
  else if(d.c){fC=d.c;syncChips();render()}
  else if(d.go){fG=d.go;fC='all';syncChips();render()}
  else if(d.goCat){fC=d.goCat;fG='all';syncChips();render()}
  else if(d.size){chosen[d.size]=d.v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}
  else if(d.add){
    const p=P.find(q=>q.id===d.add);
    if(p.s&&!chosen[p.id]){toast(t('pickSize'));return}
    const s=chosen[p.id]||null,ex=cart.find(x=>x.id===p.id&&x.s===s);
    ex?ex.q++:cart.push({id:p.id,s,q:1});save();toast(t('added')(L(p.n)));
  }
  else if(d.wish){const id=d.wish;wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];b.setAttribute('aria-pressed',wish.includes(id));save()}
  else if(d.unwish){wish=wish.filter(x=>x!==d.unwish);save();drawer();render()}
  else if(d.q){const x=cart[+d.q];x.q+=+d.d;if(x.q<1)cart.splice(+d.q,1);save();drawer()}
  else if(d.rm){cart.splice(+d.rm,1);save();drawer()}
  else if(b.id==='cartBtn')openDr('cart');
  else if(b.id==='wishBtn')openDr('wish');
  else if(b.id==='closeDr')closeDr();
  else if(b.id==='checkout'){const m=$('#coMsg');m.hidden=false;m.textContent=t('demo')}
  else if(b.id==='langBtn'){lang=lang==='ar'?'en':'ar';store.set('nobl.lang',lang);applyLang()}
  else if(b.id==='themeBtn'){
    const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;
    r.dataset.theme=dark?'light':'dark';store.set('nobl.theme',r.dataset.theme);
  }
});
$('#scrim').addEventListener('click',closeDr);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});
$('#bookForm').addEventListener('submit',e=>{
  e.preventDefault();const err=$('#formErr'),msg=$('#formMsg');
  const name=$('#bName').value.trim(),phone=$('#bPhone').value.replace(/\s/g,''),date=$('#bDate').value;
  const problem=!name?t('errName'):!/^\+?\d{10,14}$/.test(phone)?t('errPhone'):!date?t('errDate'):'';
  err.hidden=!problem;err.textContent=problem;msg.hidden=!!problem;
  if(!problem)msg.textContent=t('okForm')(name.split(' ')[0],new Date(date+'T12:00').toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'}));
});
const tm=new Date();tm.setDate(tm.getDate()+1);$('#bDate').min=tm.toISOString().slice(0,10);
const th=store.get('nobl.theme',null);if(th)document.documentElement.dataset.theme=th;
applyLang();
</script>

</body>
</html>
